[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-maintenance-system"
version = "0.1.0"
description = "Standalone predictive maintenance simulator with time-series forecasting and maintenance scheduling."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "numpy>=1.26.0",
    "pydantic>=2.8.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
predictive-maintenance-system = "predictive_maintenance_system.api:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
